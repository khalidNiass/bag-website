<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotshionHub | Orders Management</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css"> </head>
<body class="admin-body">
<div id="message"></div>
    <header>
        <span>HOTSHIONHUB <small>| ORDERS</small></span>
        <div class="header-actions">
            <a href="admin.html" class="icon-btn" title="Back to Dashboard" aria-label="Back to Dashboard"><i class="fas fa-arrow-left"></i></a>
        </div>
    </header>

    <section class="section">
        <div class="stats-grid">
            <div class="stat-box">
                <i class="fas fa-coins"></i>
                <div class="stat-info">
                    <span class="stat-label">Total Revenue</span>
                    <h3 id="stat-revenue">₦0</h3>
                </div>
            </div>
            <div class="stat-box">
                <i class="fas fa-shopping-cart"></i>
                <div class="stat-info">
                    <span class="stat-label">Total Orders</span>
                    <h3 id="stat-orders">0</h3>
                </div>
            </div>
        </div>

        <h2>Recent Customer Orders</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Ref</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-orders-list">
                    </tbody>
            </table>
        </div>
    </section>

    <script src="admin.js"></script>
</body>
</html>
