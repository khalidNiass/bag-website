<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotshionHub | Admin Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

    <div id="loader-wrapper">
        <div class="loader-ring"></div>
        <p id="loader-text">Loading Dashboard...</p>
    </div>

    <header>
        <span>HOTSHIONHUB <small>| ADMIN</small></span>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </header>

    <div id="message"></div>

    <section class="section">
        <h2>Business Management</h2>
        <div class="stats-grid">
            <a href="orders.html" class="stat-box nav-card">
                <i class="fas fa-shopping-cart"></i>
                <div class="stat-info">
                    <span class="stat-label">Customer Orders</span>
                    <h3 id="stat-orders">0</h3>
                    <span class="view-link">Manage Orders <i class="fas fa-arrow-right"></i></span>
                </div>
            </a>

            <a href="inventory.html" class="stat-box nav-card">
                <i class="fas fa-box-open"></i>
                <div class="stat-info">
                    <span class="stat-label">Live Inventory</span>
                    <h3 id="stat-products">0</h3>
                    <span class="view-link">Edit Stock <i class="fas fa-arrow-right"></i></span>
                </div>
            </a>

            <div class="stat-box">
                <i class="fas fa-coins"></i>
                <div class="stat-info">
                    <span class="stat-label">Total Revenue</span>
                    <h3 id="stat-revenue">₦0</h3>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <h2>Add New Collection</h2>
        <div class="admin-main-grid">
            <form class="admin-form" id="productForm">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Product Name</label>
                        <input type="text" id="name" placeholder="Enter product name" required oninput="updatePreview()">
                    </div>

                    <div class="form-group">
                        <label>Price (₦)</label>
                        <input type="number" id="price" placeholder="45000" required oninput="updatePreview()">
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" required onchange="updatePreview()">
                            <option value="bags">Bags</option>
                            <option value="shoes">Shoes</option>
                            <option value="watches">Watches</option>
                            <option value="clothes">Clothes</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" required onchange="updatePreview()">
                            <option value="men">Men</option>
                            <option value="women">Women</option>
                            <option value="unisex">Unisex</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Badge</label>
                        <select id="badge" onchange="updatePreview()">
                            <option value="">None</option>
                            <option value="NEW">NEW</option>
                            <option value="HOT">HOT</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Available Colors</label>
                        <div id="colorsContainer" class="color-selector-grid">
                            <label class="color-option"><input type="checkbox" value="Black" onchange="updatePreview()"> <span>Black</span></label>
                            <label class="color-option"><input type="checkbox" value="Brown" onchange="updatePreview()"> <span>Brown</span></label>
                            <label class="color-option"><input type="checkbox" value="Gold" onchange="updatePreview()"> <span>Gold</span></label>
                            <label class="color-option"><input type="checkbox" value="White" onchange="updatePreview()"> <span>White</span></label>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Upload Product Images</label>
                        <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageUpload(this)">
                    </div>

                    <div class="form-group full-width">
                        <label>Description</label>
                        <textarea id="description" placeholder="Describe the luxury details..." rows="4" required></textarea>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Publish to Shop</button>
            </form>

            <div class="preview-container">
                <p class="preview-label">Live Shop Preview</p>
                <div class="preview-card" id="live-preview">
                    <div class="preview-img-box">
                        <span id="preview-badge" class="badge-tag" style="display:none;">NEW</span>
                        <img id="preview-img" src="https://via.placeholder.com/300x400?text=HotshionHub" alt="Preview">
                    </div>
                    <div class="preview-info">
                        <span id="preview-category-tag" class="preview-meta">CATEGORY • GENDER</span>
                        <h3 id="preview-name">Product Name</h3>
                        <p id="preview-price">₦0</p>
                        <div id="preview-colors" class="color-dots"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="loasding.js"></script>
    <script src="admin.js"></script>
</body>
</html>
