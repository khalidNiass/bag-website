<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | HotshionHub</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body admin-login">
<div class="page-loader" aria-hidden="true"></div>
<div class="login-shell login-shell--compact">
  <div class="login-box">
    <div class="login-mark">
      <span class="login-dot"></span>
      <span class="login-brand">HOTSHIONHUB</span>
      <span class="login-divider">•</span>
      <span class="login-mode">Admin</span>
    </div>
    <h2>Secure Access</h2>
    <p class="login-sub">Sign in to manage products and orders.</p>

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Admin username" autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

    <button onclick="login()">Enter Dashboard</button>

    <p class="error" id="error"></p>
  </div>
</div>

<script src="api-config.js"></script>
<script src="admin-login.js"></script>
  <script src="loasding.js"></script>
</body>
</html>
