services:
  - type: web
    name: bag-website-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://bag-website-api.onrender.com
      - key: FRONTEND_URL
        value: https://hotshionhub.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: bag-website
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAIL_SERVICE
        value: gmail
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
